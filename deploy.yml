name: 🚀 Deploy Laravel Application

on:
  push:
    branches:
      - main
      - staging

# ======================================================
# 🔴 PRODUCTION DEPLOYMENT (main branch)
# ======================================================
jobs:
  deploy-production:
    name: 🚀 Deploy to Production
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH (Production)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: 🚀 Deploy Laravel App (Production)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          SERVER_HOST: ${{ secrets.PROD_HOST }}
          SERVER_USER: ${{ secrets.PROD_USER }}
        run: |
          set -e

          DEPLOY_DIR="/var/www/html/laravel-prod-app"

          echo "🚀 Deploying to PRODUCTION"
          echo "🖥️ $SERVER_USER@$SERVER_HOST"
          echo "📁 $DEPLOY_DIR"

          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" << EOF
            set -e

            cd "$DEPLOY_DIR" || exit 1

            REPO_URL="https://${GH_USERNAME}:${GH_PAT}@github.com/your-org/laravel-app.git"

            if [ -d ".git" ]; then
              echo "🔄 Updating repository"
              git remote set-url origin "\$REPO_URL"
              git fetch origin
              git checkout main || git checkout -b main origin/main
              git reset --hard origin/main
            else
              echo "📥 Cloning repository"
              git clone -b main "\$REPO_URL" .
            fi

            echo "✅ Production deployment completed"
          EOF

# ======================================================
# 🟡 STAGING DEPLOYMENT (staging branch)
# ======================================================
  deploy-staging:
    name: 🧪 Deploy to Staging
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH (Staging)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: 🚀 Deploy Laravel App (Staging)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          SERVER_HOST: ${{ secrets.STAGING_HOST }}
          SERVER_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -e

          DEPLOY_DIR="/var/www/html/laravel-staging-app"

          echo "🧪 Deploying to STAGING"
          echo "🖥️ $SERVER_USER@$SERVER_HOST"
          echo "📁 $DEPLOY_DIR"

          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" << EOF
            set -e

            cd "$DEPLOY_DIR" || exit 1

            REPO_URL="https://${GH_USERNAME}:${GH_PAT}@github.com/your-org/laravel-app.git"

            if [ -d ".git" ]; then
              echo "🔄 Updating repository"
              git remote set-url origin "\$REPO_URL"
              git fetch origin
              git checkout staging || git checkout -b staging origin/staging
              git reset --hard origin/staging
            else
              echo "📥 Cloning repository"
              git clone -b staging "\$REPO_URL" .
            fi

            echo "✅ Staging deployment completed"
          EOF
